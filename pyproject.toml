[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mowkow"
version = "1.0.0"
description = "간편한 한글 프로그래밍 언어 '머꼬'"
authors = [{name = "Woogyun", email = "woogyun@gmail.com"}]
dependencies = []
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
mk = "mowkow.main:main"

[tool.setuptools]
packages = ["mowkow"]

[tool.setuptools.package-data]
mowkow = ["library_kor.scm"]
